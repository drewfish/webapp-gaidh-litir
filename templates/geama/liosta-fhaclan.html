{% extends "base.html" %}
{% block title %}Liosta-Fhaclan{% endblock %}
{% block content %}
    <div id="instructions-en">
        Find all words using the provided letters.
    </div>
    <div class="flex flex-row">
        <div class="max-w-140">
            <div class="w-full mb-1 bg-indigo-200 rounded-md p-2 flex flex-col place-items-center">
                <div id="an-t-oidheam" class="mb-2 text-lg font-mono"></div>
                <div id="ion-chur">
                    <span id="an-t-eirmeas" class="text-lg font-mono"></span>
                    <button id="eirmeas-caill" class="mr-2 glf-button bg-red-300 hover:bg-red-400 text-red-800 font-bold">X</button>
                    <button id="tomhais" class="glf-button bg-green-600 hover:bg-green-800 text-white">tomhais!</button>
                </div>
            </div>
            <div class="w-full max-h-[70dvh] bg-indigo-200 rounded-md p-2 overflow-y-auto">
                <div id="na-cuimsean" class="font-mono text-center">
                    {%- for cuimse in game_data.cuimsean %}
                        <a id="cuimse-{{cuimse.facal}}" data-staid="sonn" class="glf-cuimse">{%- for litir in cuimse.facal %}<span id="cuimse-{{cuimse.facal}}-{{loop.index0}}" class="glf-cuimse-litir">_</span>{% endfor -%}</a>
                    {%- endfor %}
                </div>
            </div>
        </div>
        <div id="deifinisean-ion-loidhne" class="ml-1 hidden md:block">
            <div class="glf-deifinisean">
                <ul class="glf-liosta-dheifinisean"></ul>
            </div>
        </div>
    </div>
    <div id="glf-priob-uinneag" class="hidden">
        <div class="glf-deifinisean">
            <ul class="glf-liosta-dheifinisean"></ul>
        </div>
    </div>

    <script type="text/javascript">
        const DÀTA_GEAMA = {{ game_data | json | safe }};
        const STAID = {
            comhailteach: false,
            le_stràc: false,    // anns an oidheam
            le_tàthan: false,   // anns na cuimsean
            oidheam: [],
            eirmeas: [],
            eirmeas_taghta: [],
            cuimsean: {},
        };
        const STRÀCADH = { "a": "à", "e": "è", "i": "ì", "o": "ò", "u": "ù" }
        const SEÒRSAN_FHACLAN = {
            "boir.": "ainmear boireannta (feminine noun)",
            "bua.": "buadhair (adjective)",
            "co-ghn.": "co-ghnìomhair (adverb)",
            "cst.": "ceisteach (interrogative)",
            "fir.": "ainmear fireannta (masculine noun)",
            "gn.": "gnìomhair (verb)",
            "m.-fh.": "mion-fhacal (partical)",
            "nsg.": "naisgear (conjuction)",
            "roi. gin.": "roimhear le ginideach (preposition + genitive)",
            "roi.": "roimhear (preposition)",
        };
        const DEIFINISEANAN = {};

        function geama_suidheachadh() {
            if (DÀTA_GEAMA.error) {
                const cearrDOM = document.createElement("div");
                cearrDOM.textContent = DÀTA_GEAMA.error;
                cearrDOM.classList.add("glf-geama-error");
                document.getElementById("an-t-oidheam").appendChild(cearrDOM);
                return;
            }
            staid_suidheachadh();
            oidheam_suidheachadh();
            eirmeas_suidheachadh();
            cuimsean_suidheachadh();
            meur_chlàr_suidheachadh();
            staid_leugh();
            oidheam_à_comas();
            oidheam_ùraich();
            geama_comhailteach();
            deifinisean_suidheachadh();
        }

        function geama_ùraich() {
            for (const oidheam of STAID.oidheam) {
                if (oidheam.staid === "taghta") {
                    oidheam.staid = "neo-taghta";
                }
            }
            for (const eirmeas of STAID.eirmeas) {
                if (eirmeas.staid === "taghta") {
                    eirmeas.staid = "neo-taghta";
                    eirmeas.litir = "_";
                }
            }
            for (const [eirmeasÀite, [litir, oidheamÀite]] of STAID.eirmeas_taghta.entries()) {
                const oidheam = STAID.oidheam[oidheamÀite];
                if (oidheam.staid === "neo-taghta") {
                    oidheam.staid = "taghta";
                    if (oidheam.litir === "-" && eirmeas_mu_dheireadh() !== "-") {
                        oidheam.staid = "neo-taghta";
                    }
                }
                const eirmeas = STAID.eirmeas[eirmeasÀite];
                if (eirmeas) {
                    eirmeas.staid = "taghta";
                    eirmeas.litir = litir;
                }
            }
            oidheam_ùraich();
            eirmeas_ùraich();
            cuimsean_soillsich();
        }

        function geama_comhailteach() {
            const hiostogram = {};
            for (const cuimse of Object.values(STAID.cuimsean)) {
                hiostogram[cuimse.staid] = (hiostogram[cuimse.staid] || 0) + 1;
            }
            if (hiostogram["sonn"] || hiostogram["highlighted"]) {
                return;
            }
            let teachdaireachd = "sin sibh fhein!";
            if (hiostogram["taisbeanta"]) {
                teachdaireachd = "sin thu!";
            }
            STAID.comhailteach = true;
            const ionChurDOM = document.getElementById("ion-chur");
            const àrd = window.getComputedStyle(ionChurDOM).height;
            const comhailteachDOM = document.createElement("div");
            comhailteachDOM.id = "glf-comhailteach";
            comhailteachDOM.textContent = teachdaireachd;
            comhailteachDOM.style.height = àrd;
            ionChurDOM.replaceWith(comhailteachDOM);
            for (const oidheam of STAID.oidheam) {
                const litirDOM = document.getElementById(`oidheam-${oidheam.àite}`);
                litirDOM.setAttribute("data-staid", "taghta");
            }
        }

        function staid_suidheachadh() {
            DEIFINISEANAN[DÀTA_GEAMA.oidheam] = DÀTA_GEAMA.oidheam_deifiniseanan;
            for (const cuimse of DÀTA_GEAMA.cuimsean) {
                STAID.cuimsean[cuimse.facal] = {
                    facal: cuimse.facal,
                    staid: "sonn",  // sonn(hidden), soillsichte(highlighted), air sgeul(found), taisbeanta(shown)
                };
                if (cuimse.facal.includes("-")) {
                    STAID.le_tàthan = true;
                }
                DEIFINISEANAN[cuimse.facal] = cuimse.deifiniseanan;
            }
            for (const [àite, litir] of DÀTA_GEAMA.oidheam.split("").entries()) {
                STAID.oidheam[àite] = {
                    àite: àite,
                    litir: litir,
                    staid: "neo-taghta",    // neo-taghta, taghta, à comas
                };
                if ("àèìòù".includes(litir)) {
                    STAID.le_stràc = true;
                }
            }
            if (STAID.le_tàthan && !DÀTA_GEAMA.oidheam.includes("-")) {
                const àite = STAID.oidheam.length;
                STAID.oidheam[àite] = {
                    àite: àite,
                    litir: "-",
                    staid: "neo-taghta",    // neo-taghta, taghta, à comas
                    far: true,
                };
            }
            for (let àite = 0; àite < DÀTA_GEAMA.uas_mheud_fad; àite++) {
                STAID.eirmeas[àite] = {
                    àite: àite,
                    litir: "_",
                    staid: "neo-taghta",    // neo-taghta, taghta
                };
            }
        }

        function staid_leugh() {
            if (window.location.href.includes("?ath-shuidhich") || window.location.href.includes("?reset")) {
                localStorage.removeItem("staid a' gheama");
                window.location.href = window.location.href.split("?")[0];
                return;
            }
            const staidAmh = localStorage.getItem("staid a' gheama");
            if (! staidAmh) {
                return;
            }
            const staid = JSON.parse(staidAmh);
            if (staid.oidheam !== DÀTA_GEAMA.oidheam) {
                localStorage.removeItem("staid a' gheama");
                return;
            }
            for (const facal in staid.cuimsean) {
                if (STAID.cuimsean[facal]) {
                    cuimse_suidhich_staid(facal, staid.cuimsean[facal], {sgrolaich: false});
                }
            }
        }

        function staid_sgriobh() {
            const staid = {
                seòrsa: "v2",
                oidheam: DÀTA_GEAMA.oidheam,
                cuimsean: {},
            }
            for (const cuimse of Object.values(STAID.cuimsean)) {
                staid.cuimsean[cuimse.facal] = cuimse.staid;
            }
            const staidAmh = JSON.stringify(staid);
            localStorage.setItem("staid a' gheama", staidAmh);
        }

        function oidheam_suidheachadh() {
            const antOidheamDOM = document.getElementById("an-t-oidheam");
            for (const oidheam of STAID.oidheam) {
                const litirDOM = document.createElement("button");
                litirDOM.id = `oidheam-${oidheam.àite}`;
                litirDOM.setAttribute("data-staid", oidheam.staid);
                litirDOM.textContent = oidheam.litir;
                litirDOM.classList.add("glf-oidheam");
                if (oidheam.far) {
                    litirDOM.classList.add("glf-oidheam-far");
                }
                antOidheamDOM.appendChild(litirDOM);
                litirDOM.addEventListener("click", () => {
                    oidheam_cliog(oidheam.àite);
                });
            }
        }

        function oidheam_cliog(àite) {
            if (STAID.comhailteach) {
                deifinisean_seall(DÀTA_GEAMA.oidheam, {fosgail: true});
                return;
            }
            const oidheam = STAID.oidheam[àite];
            if (oidheam.staid === "neo-taghta") {
                eirmeas_cuir_ris(oidheam.litir, oidheam.àite);
                geama_ùraich();
                return;
            }
            if (oidheam.staid === "taghta") {
                for (const [eirmeasÀite, [litir, oidheamÀite]] of STAID.eirmeas_taghta.entries()) {
                    if (àite === oidheamÀite) {
                        eirmeas_sguab_às(eirmeasÀite);
                        geama_ùraich();
                        return;
                    }
                }
                return;
            }
        }

        function oidheam_à_comas() {
            // ... ach thoir sùil an toiseach
            const damnaichte = {};
            for (const oidheam of STAID.oidheam) {
                damnaichte[oidheam.litir] = true;
            }
            for (const cuimse of Object.values(STAID.cuimsean)) {
                if (! cuimse_nochdaidh(cuimse.staid)) {
                    for (const litir of cuimse.facal) {
                        delete damnaichte[litir];
                    }
                }
            }
            for (const oidheam of STAID.oidheam) {
                if (Object.keys(damnaichte).includes(oidheam.litir)) {
                    oidheam.staid = "à comas";
                }
            }
        }

        function oidheam_ùraich() {
            for (const oidheam of STAID.oidheam) {
                const litirDOM = document.getElementById(`oidheam-${oidheam.àite}`);
                litirDOM.setAttribute("data-staid", oidheam.staid);
            }
        }

        function eirmeas_sreang() {
            let sreang = "";
            for (const [litir] of STAID.eirmeas_taghta) {
                sreang += litir;
            }
            return sreang;
        }

        function eirmeas_suidheachadh() {
            const antEirmeasDOM = document.getElementById("an-t-eirmeas");
            for (const eirmeas of STAID.eirmeas) {
                const litirDOM = document.createElement("button");
                litirDOM.id = `eirmeas-${eirmeas.àite}`;
                litirDOM.setAttribute("data-staid", eirmeas.staid);
                litirDOM.textContent = eirmeas.litir;
                litirDOM.classList.add("glf-eirmeas");
                antEirmeasDOM.appendChild(litirDOM);
                litirDOM.addEventListener("click", () => {
                    eirmeas_cliog(eirmeas.àite);
                });
            }
            const caillDOM = document.getElementById("eirmeas-caill");
            caillDOM.style.visibility = "hidden";
            caillDOM.addEventListener("click", () => {
                eirmeas_ath_shuidhich();
                geama_ùraich();
            });
            const tomhaisDOM = document.getElementById("tomhais");
            tomhaisDOM.addEventListener("click", eirmeas_tomhais);
        }

        function eirmeas_cliog(àite) {
            if (STAID.comhailteach) {
                return;
            }
            const eirmeas = STAID.eirmeas[àite];
            if (eirmeas.staid === "taghta") {
                eirmeas_sguab_às(àite);
                geama_ùraich();
            }
        }

        function eirmeas_cuir_ris(litir, oidheamÀite) {
            if (STAID.eirmeas_taghta.length >= DÀTA_GEAMA.uas_mheud_fad) {
                return;
            }
            STAID.eirmeas_taghta.push([litir, oidheamÀite]);
        }

        function eirmeas_mu_dheireadh() {
            if (! STAID.eirmeas_taghta.length) {
                return "";
            }
            return STAID.eirmeas_taghta.at(-1)[0];
        }

        function eirmeas_sguab_às(àite) {
            if (àite === -1) {
                STAID.eirmeas_taghta.pop();
            } else {
                STAID.eirmeas_taghta.splice(àite, 1);
            }
        }

        function eirmeas_ath_shuidhich() {
            STAID.eirmeas_taghta = [];
        }

        function eirmeas_tomhais() {
            const eirmeas = eirmeas_sreang();
            if (! eirmeas) {
                return;
            }
            const cuimse = STAID.cuimsean[eirmeas];
            if (! cuimse) {
                const caillDOM = document.getElementById("eirmeas-caill");
                caillDOM.style.visibility = "visible";
                return;
            }
            cuimse_suidhich_staid(cuimse.facal, "air sgeul");
            eirmeas_ath_shuidhich();
            oidheam_à_comas();
            geama_ùraich();
            geama_comhailteach();
            staid_sgriobh();
            deifinisean_seall(eirmeas, {fosgail: true});
        }

        function eirmeas_ùraich() {
            for (const eirmeas of STAID.eirmeas) {
                const litirDOM = document.getElementById(`eirmeas-${eirmeas.àite}`);
                litirDOM.setAttribute("data-staid", eirmeas.staid);
                litirDOM.textContent = eirmeas.litir;
            }
            const caillDOM = document.getElementById("eirmeas-caill");
            caillDOM.style.visibility = "hidden";
        }

        function cuimse_nochdaidh(staid) {
            return ["air sgeul", "taisbeanta"].includes(staid);
        }

        function cuimse_seall_aon() {
            const dualachdan = [];
            for (const cuimse of Object.values(STAID.cuimsean)) {
                if (! cuimse_nochdaidh(cuimse.staid)) {
                    dualachdan.push(cuimse.facal);
                }
            }
            if (! dualachdan) {
                return;
            }
            const àite = Math.floor(Math.random() * dualachdan.length);
            const facal = dualachdan[àite];
            cuimse_suidhich_staid(facal, "taisbeanta");
            eirmeas_ath_shuidhich();
            oidheam_à_comas();
            geama_ùraich();
            geama_comhailteach();
            staid_sgriobh();
        }

        function cuimse_suidhich_staid(facal, staidÙr, roghainnean={}) {
            // sonn(hidden), soillsichte(highlighted), air sgeul(found), taisbeanta(shown)
            const cuimse = STAID.cuimsean[facal];
            if (cuimse.staid === staidÙr) {
                return;
            }
            // TRANSITIONS
            // sonn -> soillsichte          -- OK, happens when any eirmeas.litir is in cuimse.facal
            // sonn -> air sgeul            -- OK, happens during eirmeas_tomhais() (before we know how to highlight)
            // sonn -> taisbeanta           -- OK, happens during cuimse_seall_aon()
            // soillsichte -> sonn          -- OK, happens during eirmeas_ath_shuidhich()
            // soillsichte -> air sgeul     -- OK, happens during eirmeas_tomhais() (once we know how to highlight)
            // soillsichte -> taisbeanta    -- OK, happens during eirmeas_tomhais() (once we know how to highlight)
            // air sgeul -> sonn            -- NOPE
            // air sgeul -> soillsichte     -- NOPE
            // air sgeul -> taisbeanta      -- NOPE
            // taisbeanta -> sonn           -- NOPE
            // taisbeanta -> soillsichte    -- NOPE
            // taisbeanta -> air sgeul      -- NOPE, maybe OK during eirmeas_tomhais() (user re-types a shown cuimse)
            let dèanE = false;
            if (! cuimse_nochdaidh(cuimse.staid)) {
                dèanE = true;
            }
            if (staidÙr === "air sgeul") {
                dèanE = true;
            }
            if (! dèanE) {
                return;
            }
            const cuimseDOM = document.getElementById(`cuimse-${cuimse.facal}`);
            if (cuimse_nochdaidh(staidÙr)) {
                for (const [i, litir] of cuimse.facal.split("").entries()) {
                    const litirDOM = document.getElementById(`cuimse-${cuimse.facal}-${i}`);
                    litirDOM.textContent = litir;
                }
            }
            cuimse.staid = staidÙr;
            cuimseDOM.setAttribute("data-staid", cuimse.staid);
            if (roghainnean.sgrolaich ?? true) {
                cuimseDOM.scrollIntoView({behavior: "smooth", block: "nearest"});
            }
        }

        function cuimsean_suidheachadh() {
            for (const cuimse of Object.values(STAID.cuimsean)) {
                const cuimseDOM = document.getElementById(`cuimse-${cuimse.facal}`);
                cuimseDOM.addEventListener("click", () => {
                    deifinisean_seall(cuimse.facal, { fosgail: true });
                });
            }
        }

        function cuimsean_soillsich() {
            const eirmeas = eirmeas_sreang();
            for (const cuimse of Object.values(STAID.cuimsean)) {
                let staid = cuimse.staid;
                if (staid === "soillsichte") {
                    staid = "sonn";
                }
                if (staid === "sonn" && eirmeas && cuimse.facal.includes(eirmeas)) {
                    staid = "soillsichte";
                }
                if (cuimse.staid !== staid) {
                    cuimse_suidhich_staid(cuimse.facal, staid, {sgrolaich: false});
                }
            }
        }

        function deifinisean_suidheachadh() {
            const priobUinneagDOM = document.getElementById("glf-priob-uinneag");
            priobUinneagDOM.addEventListener("click", deifinisean_folaich);
            deifinisean_seall(DÀTA_GEAMA.oidheam, {fosgail: false});
        }

        function deifinisean_seall(facal, roghainnean={}) {
            const deifnan = DEIFINISEANAN[facal] || [];
            const liostaDOMs = document.getElementsByClassName("glf-liosta-dheifinisean");
            for (const liostaDOM of liostaDOMs) {
                liostaDOM.replaceChildren();
                for (const deifn of deifnan) {
                    const clàrDOM = document.createElement("li");
                    const seòrsaDOM = document.createElement("abbr");
                    seòrsaDOM.classList.add("glf-deifn-seorsa");
                    seòrsaDOM.textContent = deifn["seòrsa"];
                    if (SEÒRSAN_FHACLAN[deifn["seòrsa"]]) {
                        seòrsaDOM.setAttribute("title", SEÒRSAN_FHACLAN[deifn["seòrsa"]]);
                    }
                    let sreang = deifn["deifinisean"];
                    if (roghainnean.ionadaich && sreang.includes(facal)) {
                        // redact facal in deifinisean
                        // FUTURE -- ... or maybe not?  redacting -is- a clue to the player
                        sreang = sreang.replace(facal, '<span class="glf-ionadaich">' + "_".repeat(facal.length) + '</span>');
                    }
                    // style parentheses
                    sreang = sreang.replace(/(\([^)]*\))/g, '<span class="glf-eadar-radh">$1</span>');
                    clàrDOM.innerHTML = sreang;
                    clàrDOM.prepend(seòrsaDOM);
                    liostaDOM.appendChild(clàrDOM);
                }
            }
            const ionLoidhneDOM = document.getElementById("deifinisean-ion-loidhne");
            const stoidhle = window.getComputedStyle(ionLoidhneDOM);
            if (stoidhle.display !== "none") {
                return;
            }
            if (! (roghainnean.fosgail ?? false)) {
                return;
            }
            const priobUinneagDOM = document.getElementById("glf-priob-uinneag");
            priobUinneagDOM.style.display = "flex";
        }

        function deifinisean_folaich() {
            const priobUinneagDOM = document.getElementById("glf-priob-uinneag");
            priobUinneagDOM.style.display = "none";
        }

        function meur_chlàr_suidheachadh() {
            document.addEventListener("keydown", (tachairt) => {
                if (tachairt.key === "Enter") {
                    // when oidheam litir has focus, hitting <Enter> would cause a click
                    tachairt.preventDefault();
                }
            });
            document.addEventListener("keyup", meur_chlàr_tachairt);
        }

        function meur_chlàr_tachairt(tachairt) {
            if (STAID.comhailteach) {
                return;
            }
            if (tachairt.key === "Backspace") {
                tachairt.stopPropagation();
                tachairt.preventDefault();
                eirmeas_sguab_às(-1);
                geama_ùraich();
                return;
            }
            if (tachairt.key === "Enter") {
                tachairt.stopPropagation();
                tachairt.preventDefault();
                eirmeas_tomhais();
                return;
            }
            if ("?" === tachairt.key) {
                cuimse_seall_aon();
            }
            const litirLeStràc = STRÀCADH[tachairt.key];
            if (litirLeStràc && eirmeas_mu_dheireadh() === tachairt.key) {
                // replace last letter of eirmeas with stràc version
                for (const oidheam of STAID.oidheam) {
                    if (oidheam.staid === "neo-taghta" && oidheam.litir === litirLeStràc) {
                        eirmeas_sguab_às(-1);
                        eirmeas_cuir_ris(oidheam.litir, oidheam.àite);
                        geama_ùraich();
                        return;
                    }
                }
            }
            for (const oidheam of STAID.oidheam) {
                if (oidheam.litir === tachairt.key && oidheam.staid === "neo-taghta") {
                    const litirDOM = document.getElementById(`oidheam-${oidheam.àite}`);
                    litirDOM.click();
                    return;
                }
            }
            if (litirLeStràc) {
                // non-stràc isn't available, so add stràc version instead
                for (const oidheam of STAID.oidheam) {
                    if (oidheam.litir === litirLeStràc && oidheam.staid === "neo-taghta") {
                        const litirDOM = document.getElementById(`oidheam-${oidheam.àite}`);
                        litirDOM.click();
                        return;
                    }
                }
            }
        }

        document.addEventListener("DOMContentLoaded", geama_suidheachadh);
    </script>
{% endblock %}
